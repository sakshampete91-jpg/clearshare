name: CLEARSHARE Security & Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  security-hygiene:
    name: Secret Hygiene & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check dependency vulnerabilities
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: Reject tracked .env files and raw credential literals
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$'; then
            echo "Error: tracked .env file detected"
            exit 1
          fi
          if git grep -En '(AIza[0-9A-Za-z_-]{35}|(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|(sk|rk)_live_[0-9A-Za-z]{16,}|xox[baprs]-[0-9A-Za-z-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|(postgres|postgresql|mysql|mongodb(\+srv)?|redis):\/\/[^/\s:@]+:[^/\s@]+@)' -- ':!frontend/package-lock.json' ':!docs/screenshots/*'; then
            echo "Error: raw secret-shaped literal detected in tracked files"
            exit 1
          fi
      - name: Verify client-only browser privacy boundaries
        run: |
          if git grep -En 'localStorage|sessionStorage|dangerouslySetInnerHTML|innerHTML|XMLHttpRequest|Math\.random|console\.(log|info|debug)' -- 'frontend/src/'; then
            echo "Error: disallowed browser storage, unsafe DOM, debug logging, or non-crypto RNG found in frontend/src/"
            exit 1
          fi
